<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#9d174d" />
  <title>Achados & Perdidos — Gestão Escolar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-content">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div>
          <h1>Achados & Perdidos</h1>
          <p>Sistema de Controle de Objetos Escolares</p>
        </div>
      </div>
      <div class="stats" id="stats-bar">
        <div class="stat-pill">
          <span class="stat-label">Pendentes</span>
          <strong id="count-pendentes">0</strong>
        </div>
        <div class="stat-pill">
          <span class="stat-label">Devolvidos</span>
          <strong id="count-devolvidos">0</strong>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card form-section">
      <div class="section-header">
        <h2>Novo Registro</h2>
        <span class="section-subtitle">Preencha os dados do item encontrado ou perdido</span>
      </div>
      <form id="item-form">
        <div class="grid-form">
          <div class="field">
            <label for="nome">Objeto *</label>
            <input type="text" id="nome" placeholder="Ex: Estojo escolar rosa" required />
          </div>
          <div class="field">
            <label for="categoria">Categoria *</label>
            <select id="categoria" required>
              <option value="Material Escolar">Material Escolar</option>
              <option value="Eletrônicos">Eletrônicos</option>
              <option value="Roupas e Acessórios">Roupas e Acessórios</option>
              <option value="Documentos">Documentos</option>
              <option value="Outros">Outros</option>
            </select>
          </div>
          <div class="field">
            <label for="local">Local *</label>
            <input type="text" id="local" placeholder="Ex: Biblioteca / Sala 04" required />
          </div>
          <div class="field">
            <label for="data">Data *</label>
            <input type="date" id="data" required />
          </div>
          <div class="field">
            <label for="contato">Ponto de Retirada / Turma *</label>
            <input type="text" id="contato" placeholder="Ex: Coordenação" required />
          </div>
        </div>
        <div class="field">
          <label for="descricao">Observações</label>
          <textarea id="descricao" rows="2" placeholder="Marca, cor predominante, etiquetas ou detalhes de identificação..."></textarea>
        </div>
        <div class="form-footer">
          <button type="submit" class="btn-primary">Registrar Item</button>
        </div>
      </form>
    </section>

    <section class="controls">
      <div class="search-wrapper">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="search" id="busca" placeholder="Pesquisar por objeto, local ou observação..." />
      </div>
      <select id="filtro-status">
        <option value="Todos">Todos os status</option>
        <option value="Pendente">Pendentes</option>
        <option value="Devolvido">Devolvidos</option>
      </select>
    </section>

    <section id="lista-itens" class="grid-itens"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
